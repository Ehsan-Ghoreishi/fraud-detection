[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
dynamic = ["version"]
description = "Cost-aware fraud detection pipeline for payment transactions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Seyedmohammad (Ehsan) Ghoreishi" }]
dependencies = [
    "pandas>=2.0,<4",
    "numpy>=1.24,<3",
    "scikit-learn>=1.3,<2",
    "matplotlib>=3.7,<4",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3"]
ieee = ["kaggle>=1.6"]

[project.scripts]
fraud-detection = "fraud_detection.cli:main"

[tool.setuptools.dynamic]
version = { attr = "fraud_detection.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["fraud_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
